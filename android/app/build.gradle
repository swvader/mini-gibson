plugins { id 'com.android.application' }
def ks = new Properties(); def ksf = rootProject.file('keystore.properties'); if (ksf.exists()) ks.load(new FileInputStream(ksf))
android {
  namespace 'net.swvader.gibson'
  compileSdk 34
  defaultConfig {
    applicationId 'net.swvader.gibson'
    minSdk 26
    targetSdk 34
    versionCode 8
    versionName '1.0.6'
    ndk { abiFilters 'arm64-v8a' }
  }
  signingConfigs { release { storeFile file(ks['storeFile'] ?: 'none'); storePassword ks['storePassword']; keyAlias ks['keyAlias']; keyPassword ks['keyPassword'] } }
  buildTypes { release { minifyEnabled false; signingConfig signingConfigs.release } }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
  androidResources { noCompress += ['onnx', 'bin'] }
  packagingOptions { jniLibs { useLegacyPackaging = false } }
}
dependencies {
  implementation files('libs/sherpa-onnx-1.13.8.aar')
  implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'
  implementation 'androidx.activity:activity:1.9.2'
  implementation 'androidx.webkit:webkit:1.11.0'
  def cx = '1.3.4'
  implementation "androidx.camera:camera-core:$cx"
  implementation "androidx.camera:camera-camera2:$cx"
  implementation "androidx.camera:camera-lifecycle:$cx"
  implementation 'com.google.mlkit:face-detection:16.1.7'
  implementation 'com.google.mlkit:text-recognition:16.0.1'
}
